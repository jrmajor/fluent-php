name: CI

on: push

env:
  PHP_LOWEST: '8.4'
  PHP_LATEST: '8.5'

jobs:
  tests:
    name: Tests / ${{ matrix.php }} PHP, ${{ matrix.dependencies }} deps

    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: [lowest, latest]
        dependencies: [lowest, highest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php == 'lowest' && env.PHP_LOWEST || env.PHP_LATEST }}
          coverage: none

      - name: Node assertions cache
        uses: actions/cache@v6
        with:
          path: .cache/node-assertions
          key: node-assertions-${{ github.sha }}
          restore-keys: node-assertions-

      - name: Get runtime dependencies
        id: runtime-deps
        run: echo "packages=$(jq -r '.require | keys | map(select(contains("/"))) | join(" ")' composer.json)" >> $GITHUB_OUTPUT

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: ${{ matrix.dependencies }}
          composer-options: ${{ steps.runtime-deps.outputs.packages }} --with-all-dependencies

      - name: Setup pnpm and install dependencies
        uses: pnpm/setup@v3
        with:
          cache: true

      - name: Execute tests
        run: vendor/bin/phpunit

  types:
    name: Types / ${{ matrix.php }} PHP

    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - php: lowest
            dependencies: lowest
          - php: latest
            dependencies: highest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php == 'lowest' && env.PHP_LOWEST || env.PHP_LATEST }}
          coverage: none

      - name: PHPStan cache
        uses: actions/cache@v6
        with:
          path: .cache/phpstan
          key: phpstan-${{ github.sha }}
          restore-keys: phpstan-

      - name: Get runtime dependencies
        id: runtime-deps
        run: echo "packages=$(jq -r '.require | keys | map(select(contains("/"))) | join(" ")' composer.json)" >> $GITHUB_OUTPUT

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: ${{ matrix.dependencies }}
          composer-options: ${{ steps.runtime-deps.outputs.packages }} --with-all-dependencies

      - name: Run PHPStan
        run: vendor/bin/phpstan analyze --no-progress --no-interaction

  style:
    name: Style

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_LOWEST }}
          coverage: none

      - name: PHP-CS-Fixer cache
        uses: actions/cache@v6
        with:
          path: .cache/.php-cs-fixer.cache
          key: php-cs-fixer-${{ github.sha }}
          restore-keys: php-cs-fixer-

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v4

      - name: Run PHP-CS-Fixer
        run: vendor/bin/php-cs-fixer fix --dry-run --diff --no-interaction

  integrity:
    name: Integrity

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_LATEST }}
          coverage: none

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v4

      - name: Setup pnpm and install dependencies
        uses: pnpm/setup@v3
        with:
          cache: true

      - name: Compile rules
        run: |
          php gen currencies
          php gen numbers
          php gen units

      - name: Check for uncommitted changes
        run: git add . && git diff --cached --exit-code
